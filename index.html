<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台股策略控制台 V2.1</title>
<style>
body{margin:0;background:#f3f5f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif;color:#111827}
.wrap{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px}
h1{font-size:24px}h2{font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;color:#6b7280;font-size:14px;margin-bottom:6px}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #e5e7eb;border-radius:12px;font-size:17px}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#111827;color:#fff;font-size:17px;font-weight:700}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.box{background:#f8fafc;border-radius:14px;padding:12px}
.box b{display:block;font-size:19px;margin-top:4px}
.small{font-size:13px;color:#6b7280}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px 5px;border-bottom:1px solid #e5e7eb;text-align:right}
th:first-child,td:first-child{text-align:left}
@media(max-width:560px){.grid,.kpi{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>台股策略控制台 V2.1</h1>

<div class="card">
<h2>持倉資料</h2>
<div class="grid">
<div><label>目前可運用總資金</label><input id="capital" type="number" value="1000000"></div>
<div><label>正2買入單價</label><input id="buyPrice" type="number" step="0.01" value="250"></div>
<div><label>正2買入張數</label><input id="lots" type="number" step="1" value="1"></div>
<div><label>本輪大盤最高收盤</label><input id="peakIndex" type="number" step="0.01" value="30000"></div>
</div>
</div>

<div class="card">
<h2>最新行情</h2>
<div class="grid">
<div><label>目前大盤指數</label><input id="indexNow" type="number" step="0.01" placeholder="輸入最新指數"></div>
<div><label>目前00631L價格</label><input id="leverNow" type="number" step="0.01" placeholder="可自動抓取"></div>
</div>
<br><button onclick="fetchQuote()">抓取00631L最新收盤</button>
<p id="msg" class="small">若公開 API 在瀏覽器被限制，可直接手動輸入。</p>
</div>

<div class="card">
<h2>策略計算</h2>
<button onclick="calc()">計算加碼與再平衡</button>
<div class="kpi">
<div class="box"><span class="small">目前成本</span><b id="cost">—</b></div>
<div class="box"><span class="small">目前市值</span><b id="mv">—</b></div>
<div class="box"><span class="small">目前損益</span><b id="pnl">—</b></div>
<div class="box"><span class="small">正2曝險</span><b id="alloc">—</b></div>
</div>
</div>

<div class="card">
<h2>加碼階梯</h2>
<table>
<thead><tr><th>跌幅</th><th>指數</th><th>正2估計價</th><th>加碼金額</th></tr></thead>
<tbody id="ladder"></tbody>
</table>
<p class="small">正2估計價用「目前正2價 + 指數到目標的變動×2」近似推估，僅供參考，實際會受每日重設與路徑影響。</p>
</div>

<div class="card">
<h2>+30% 再平衡</h2>
<div class="kpi">
<div class="box"><span class="small">目標正2價</span><b id="rebPrice">—</b></div>
<div class="box"><span class="small">目標正2市值</span><b id="rebTarget">—</b></div>
<div class="box"><span class="small">預估賣出金額</span><b id="sellAmt">—</b></div>
<div class="box"><span class="small">預估賣出張數</span><b id="sellLots">—</b></div>
</div>
<p id="signal"></p>
</div>
</div>

<script>
const $=x=>document.getElementById(x);
const f=n=>Number.isFinite(n)?Math.round(n).toLocaleString('zh-TW'):'—';
const f2=n=>Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:2}):'—';

function save(){['capital','buyPrice','lots','peakIndex','indexNow','leverNow'].forEach(id=>localStorage.setItem(id,$(id).value))}
function load(){['capital','buyPrice','lots','peakIndex','indexNow','leverNow'].forEach(id=>{let v=localStorage.getItem(id);if(v!==null)$(id).value=v;$(id).addEventListener('input',save)})}

function calc(){
save();
const capital=+$('capital').value,bp=+$('buyPrice').value,lots=+$('lots').value,peak=+$('peakIndex').value,idx=+$('indexNow').value,lp=+$('leverNow').value;
const shares=lots*1000,cost=bp*shares,mv=lp*shares,pnl=mv-cost;
$('cost').textContent='NT$ '+f(cost);
$('mv').textContent='NT$ '+f(mv);
$('pnl').textContent=(Number.isFinite(pnl)?(pnl>=0?'+':'')+'NT$ '+f(pnl):'—');
$('alloc').textContent=capital>0?(mv/capital*100).toFixed(1)+'%':'—';

const steps=[[-15,10],[-30,15],[-45,20],[-60,15]];
let html='';
steps.forEach(([dd,add])=>{
 const trig=peak*(1+dd/100);
 let est=NaN;
 if(idx>0&&lp>0){const r=trig/idx-1; est=lp*(1+2*r);}
 html+=`<tr><td>${dd}%</td><td>${f2(trig)}</td><td>${Number.isFinite(est)?'$ '+f2(est):'—'}</td><td>NT$ ${f(capital*add/100)}</td></tr>`;
});
$('ladder').innerHTML=html;

const rebPrice=bp*1.30;
const rebMv=rebPrice*shares;
const totalAtReb=capital+(rebMv-cost);
const target=totalAtReb*0.30;
const sell=Math.max(0,rebMv-target);
$('rebPrice').textContent='$ '+f2(rebPrice);
$('rebTarget').textContent='NT$ '+f(target);
$('sellAmt').textContent='NT$ '+f(sell);
$('sellLots').textContent=rebPrice>0?(sell/rebPrice/1000).toFixed(2)+' 張':'—';

let s='';
if(idx>0&&peak>0){
 const dd=(idx/peak-1)*100;
 if(dd<=-60)s='🔴 已到 -60% 層級';
 else if(dd<=-45)s='🔴 已到 -45% 層級';
 else if(dd<=-30)s='🟠 已到 -30% 層級';
 else if(dd<=-15)s='🟡 已到 -15% 層級';
 else s='🟢 尚未到下一個加碼層級';
}
if(lp>0&&bp>0&&lp>=rebPrice)s='🟢 正2已達 +30%，進入再平衡條件';
$('signal').textContent=s;
}

async function fetchQuote(){
$('msg').textContent='正在抓取…';
try{
 const r=await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL',{cache:'no-store'});
 const data=await r.json();
 const row=data.find(x=>x.Code==='00631L');
 if(row){
  const p=parseFloat(String(row.ClosingPrice).replace(/,/g,''));
  if(Number.isFinite(p)){ $('leverNow').value=p; $('msg').textContent='已更新00631L最新收盤。'; save(); calc(); return; }
 }
 $('msg').textContent='沒有取得00631L資料，請手動輸入。';
}catch(e){$('msg').textContent='瀏覽器/API限制，請手動輸入00631L。';}
}

load();calc();
</script>
</body>
</html>
