name: Update stock scanner

on:
  workflow_dispatch:
  schedule:
    # 15:00 Taiwan, Monday-Friday (07:00 UTC)
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stock scanner data
        run: python update_stocks.py

      - name: Commit scanner and statistics data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.json stocks_meta.json history/ signals_history.json stats_summary.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update stock scanner, history and statistics"
            git pull --rebase origin main
            git push origin main
          fi
