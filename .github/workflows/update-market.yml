name: Update market data

on:
  workflow_dispatch:
  schedule:
    # During Taiwan trading hours: every 5 minutes from 09:00 through 13:55.
    - cron: "*/5 1-5 * * 1-5"
    # Extra refresh at 08:00 and 15:00 Taiwan.
    - cron: "0 0,7 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update TAIEX and 00631L from TWSE MIS
        run: |
          python - <<'PY'
          import json, urllib.request, datetime
          from pathlib import Path

          URL = "https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_t00.tw%7Ctse_00631L.tw&json=1&delay=0"
          req = urllib.request.Request(URL, headers={
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json,text/plain,*/*",
              "Referer": "https://mis.twse.com.tw/stock/index.jsp",
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read().decode("utf-8"))

          rows = data.get("msgArray") or []
          def num(v):
              try:
                  s = str(v).replace(",", "").strip()
                  if s in ("", "-", "--"): return None
                  return float(s)
              except Exception:
                  return None

          taiex_row = next((x for x in rows if str(x.get("c", "")) in ("t00", "TAIEX") or "加權" in str(x.get("n", ""))), None)
          etf_row = next((x for x in rows if str(x.get("c", "")) == "00631L"), None)

          try:
              old = json.loads(Path("market.json").read_text(encoding="utf-8"))
          except Exception:
              old = {}

          idx = num((taiex_row or {}).get("z"))
          etf = num((etf_row or {}).get("z"))
          if idx is None:
              idx = num(((old.get("taiex") or {}).get("price")))
          if etf is None:
              etf = num(((old.get("etf00631L") or {}).get("price")))

          if idx is None or etf is None:
              raise SystemExit(f"TWSE MIS missing price: taiex={idx}, 00631L={etf}")

          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8)))
          def market_time(row):
              d = str((row or {}).get("d", "")).strip()
              t = str((row or {}).get("t", "")).strip()
              if len(d) == 8 and t:
                  return f"{d[:4]}-{d[4:6]}-{d[6:]} {t}"
              return now.strftime("%Y-%m-%d %H:%M:%S")

          out = {
              "updated_at": now.strftime("%Y-%m-%d %H:%M:%S"),
              "source": "TWSE MIS",
              "taiex": {"price": round(idx, 2), "market_time": market_time(taiex_row)},
              "etf00631L": {"price": round(etf, 2), "market_time": market_time(etf_row)},
          }
          Path("market.json").write_text(json.dumps(out, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update live market data"
            git pull --rebase origin main
            git push origin main
          fi
